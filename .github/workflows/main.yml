name: Deploy via FTP

on:
  push:
    branches:
      - main  # Deploy when pushing to the main branch
      - demo  # Deploy when pushing to the demo branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Updated from 16 to 20 to match required engines

      - name: Install dependencies
        run: npm install

      - name: Build the app
        run: npm run build

      # Deploy to production (main branch → uthutho.co.za)
      - name: Deploy to Production via FTP
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT }}
          local-dir: dist/
          server-dir: /public_html/
          cleanup: true

      # Deploy to demo (demo branch → demo.uthutho.co.za)
      - name: Deploy to Demo via FTP
        if: github.ref == 'refs/heads/demo'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.DEMO_FTP_SERVER }}
          username: ${{ secrets.DEMO_FTP_USERNAME }}
          password: ${{ secrets.DEMO_FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.DEMO_FTP_PORT }}
          local-dir: dist/
          server-dir: /demo.uthutho.co.za/
          cleanup: true
